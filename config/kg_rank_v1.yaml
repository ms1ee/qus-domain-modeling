# 선택 규칙 kg-rank-v1과 판정 기준 — 사전 고정 (2026-11-11 Jay). 검증 세트 실행 전에 고정했고, 이후 바꾸지 않는다.
# 주의: 이 규칙은 탐색 세트(camperplus, grocery, supermarket, ticket) 결과를 본 뒤 정한 사후 설계다.
#       그래서 탐색 세트 결과는 참고로만 보고, 판정은 검증 세트로만 한다 (SWE_prj notes/decisions.md 2026-11-11).
status: frozen
frozen_at: "2026-11-11"

rule:
  name: kg-rank-v1
  # 입력(세트, 실행 n회 표본)별로:
  # 1) 노드 = 실행 n회의 정제 전 클래스를 출처 그래프 노드 키로 합친 것 (출처 KG 예비 분석과 같은 정의, 빈 키 제외)
  # 2) R1(role 자리에만 나오는 행위자, config/refine_kg.yaml)을 먼저 적용: n회 중 어느 실행에서든 R1에 지워지는 키의 노드를 뺀다
  #    (R1은 이름 키와 스토리 텍스트로만 정해지므로 실행마다 같다)
  # 3) 남은 노드를 kg-conf 점수(n=3 → kg-conf-v1-n3, n=10 → kg-conf-v1, config/kg_conf_v1.json) 내림차순으로 놓고 상위 m개를 고른다
  #    m = 그 n회 실행 각각의 클래스 수(R1 전, 서로 다른 노드 키 수)의 중앙값을 정수로 반올림 (0.5는 올림)
  #    남은 노드가 m개보다 적으면 모두 고른다. 동점은 등장 실행 수가 많은 순, 그다음 노드 키 사전순
  # 4) 고른 노드의 표기 = 가장 많이 나온 표기. 채점은 기존 채점기(score_classes)
  models: {n3: kg-conf-v1-n3, n10: kg-conf-v1}
  r1_first: true
  m: median_distinct_node_keys_per_run_round_half_up
  tie_break: [score_desc, runs_desc, key_asc]

comparisons:                     # 같은 표에 나란히 적는다
  - majority_same_n              # 등장 실행 수 > n/2 (n=3 → 2회 이상, n=10 → 6회 이상)
  - majority_same_n_plus_r1      # R1 먼저 적용 뒤 다수결
  - majority_n10                 # n=10 다수결
  - threshold_v1_0.27            # n=10, kg-conf-v1 ≥ 0.27 (R1 없음)
  - threshold_v1_n3_0.25         # n=3, kg-conf-v1-n3 ≥ 0.25 (R1 없음)

subsample: {n: 3, repeats: 100, seed: 2026}   # n=3은 세트마다 Random(f"{seed}:{세트}:3:{반복}")으로 실행 3회 비복원 추출, 100번 평균

decision:
  sets: validation               # 판정은 검증 세트(fish_chips, planningpoker, recycling, sports)로만
  criteria:
    # (1) 세트별 클래스 F1에서 "n=3 kg-rank-v1 (100번 평균) ≥ n=10 다수결"인 세트 수
    - count_sets_n3_rank_ge_n10_majority
    # (2) 같은 n 다수결 대비 F1 차이(kg-rank-v1 − 다수결)의 세트 간 부호검정, n=3과 n=10 각각.
    #     정확 이항검정, 차이 0(|차이| < 1e-9)은 뺀다. 한쪽(kg-rank-v1 > 다수결)과 양쪽 p를 모두 적는다.
    #     세트 4개면 가능한 최소 p는 한쪽 0.0625, 양쪽 0.125다
    - sign_test_vs_majority_same_n
