# Phase 1 실험 설정

# 세트 id: gold xlsx의 열 이름. 세트 id는 benchmark/stories/<id>.txt 파일명과 같다.
sets:
  camperplus: Camperplus
  grocery: Grocery
  supermarket: Supermarket
  ticket: Ticket

defect_types: [unambiguous, problem_oriented, minimal, uniform]
injection_rate: 0.2
repetitions: 3
seed: 2026

# 모델 정의. 키(이름)가 실행 기록 디렉토리 이름이 된다: runs/phase1/<이름>/...
models:
  claude-opus-5-5:
    provider: anthropic
    model: claude-opus-5-5
    # Opus 5.5는 temperature 등 샘플링 파라미터를 받지 않고(400), thinking은 항상 adaptive다.
    # effort 기본값이 medium이지만 재현성을 위해 명시한다.
    effort: medium
    max_tokens: 16000

# 용도별 모델. 한 모델을 두 역할에 쓸 수 없고, injector는 extractors와 다른 provider여야 한다.
roles:
  extractors: [claude-opus-5-5]   # Phase 1 평가 대상 (GPT 추가 예정)
  injector: null                  # 노이즈 주입기, 제3 모델 계열 (미정)
  pipeline: null                  # Phase 2 KG 파이프라인 (미정)
