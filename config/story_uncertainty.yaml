# 스토리별 구조 불확실성 예비 분석 (DRAFT, 탐색적 분석, 2026-11-11 Jay). 모델 호출 없음, 기존 스모크 출력·출처 그래프만 쓴다.
# 계산식은 전부 DRAFT다 (SWE_prj notes/decisions.md). 점수 계산은 주입 로그·정답을 읽지 않는다.
status: DRAFT

inputs: [original, problem_oriented, problem_oriented@50, problem_oriented@100,
         unambiguous, unambiguous@50, unambiguous@100, minimal, minimal@50, minimal@100]   # 실행 기록이 없는 입력은 표에 "없음"

scores:
  evidence: exact      # 스토리 s에 연결 = 출처 그래프의 완전 일치 엣지 (클래스 이름 키가 s 텍스트에 연속 단어열로 있음)
  # 클래스 등장 확률 p = 그 키가 나온 실행 수 / N (정제 전 클래스 전체)
  # U1(s) = s에 연결된 클래스들의 평균 p(1−p)
  # U2(s) = s에 연결된 클래스 중 등장 실행 수가 low_count 범위인 클래스의 비율
  # U3(s) = s에 연결된 관계(두 끝점 키가 모두 s에 완전 일치)의 평균 p(1−p). 관계 p = 등장 수 / 관계 파싱에 성공한 실행 수
  low_count: [1, 3]
  missing_score: 0     # 연결된 클래스(U1·U2)나 관계(U3)가 없는 스토리의 점수

evaluation:
  top_k: defect_count  # 상위 k 정밀도의 k = 결함 스토리 수. 경계 동점은 무작위로 깨는 경우의 기댓값
  original_top: 10     # 원본(0%) 입력에서 점수 상위 스토리 목록 길이 (자연 결함 후보)
  random: {iterations: 1000, seed: 2026}
