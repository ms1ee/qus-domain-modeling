# KG 정제(가벼운 버전) 예비 실험 규칙 — 전부 DRAFT (팀 확인 전)
# 2026-11-03 Jay 요청. 개발 세트(School) 스모크 출력으로만 규칙을 만든다. 본 실험 세트로 평가할 예정.
# 사용: python -m qus --config smoke.yaml refine-kg
#
# 순환 논리 금지: 이 파일과 qus/refine_kg.py는 주입 규칙(config/smoke_injection.yaml)과
# 주입 로그(data/noisy/**/seed*.jsonl, seed*.meta.json)를 읽지 않는다. 정답(gold)과 별칭 표(gold_fixes.yaml)도 쓰지 않는다.
# 평가(qus/refine_eval.py)만 정답·별칭·주입 로그를 읽는다 (오염 수, unambiguous 동의어 되돌림 채점).

graph_dir: graphs     # 출처 그래프 저장 위치 (runs/와 별도): graphs/<run_name>/<모델>/<세트>/<입력>/rep<k>.json

# 스토리 자리 나누기 (DRAFT)
#   role  = 문장에서 처음 나오는 "<opener> a/an/the <role>" 에서 쉼표, 주어 I, want 앞까지
#   means = role 뒤부터 처음 나오는 ends 표지 앞까지 (표지가 없으면 끝까지)
#   ends  = ends 표지 뒤 전부 (괄호 메모 등 뒤에 붙은 글도 여기에 들어간다)
#   other = role 앞에 오는 글 (예: "In order that ..., as a teacher, I want"), role을 못 찾은 스토리는 전체
# R1은 role 대 나머지만 보므로 means/ends 경계는 R1 결과에 영향이 없다
segmentation:
  role_openers: [as, being]
  ends_markers: ["so that", "so"]    # 앞에 , . ; 또는 공백이 와야 한다. 'this way', 'in order to'는 표지로 보지 않는다

# 이름 ↔ 스토리 매칭 (채점기 정규화 재사용: normalize_term → vocab_key)
#   완전 일치(exact): 이름 키가 자리 텍스트 키 안에 연속 단어로 있음 (단어 경계)
#   부분 일치(partial): 여러 단어 이름이 완전 일치하지 않고 마지막 단어(중심어)만 있음
matching:
  record_partial: true

rules:
  R1_actor:
    draft: true
    # 출처: 원 논문 p.256 Fig. 7 (오탐 분류 결정 트리) "Used only as a US role? → yes → role".
    # 논문에서는 저자 두 명이 오탐을 손으로 분류할 때 쓴 기준이다. 추출 결과에서 자동으로 지우는 규칙으로 쓴 것은 우리 적용이다
    rule: "role 자리에 한 번 이상 완전 일치하고, means·ends·other 자리에는 한 번도 안 나오는 클래스를 지운다"
    use_partial: false      # true: 부분 일치도 등장으로 친다

  R2_implementation:
    draft: true
    # 매칭 방식: exact = 이름 키 전체가 목록 용어 / head = 이름 키가 목록 용어로 끝남 (복합명사 중심어 기준)
    #           any_word = 이름 키 안 어디든 목록 용어가 연속 단어로 있음
    match: head
    # 작성 원칙 (2026-11-03, Claude 작성, DRAFT)
    #  1. 기준: Jay가 준 기술 일반 용어 11개 (API, database, table, JSON, HTTP, cache, server, UI, form, page, button).
    #     같은 범주(저장 구조, 데이터 형식, 통신·API, 인프라, UI 요소, 프로그램 구성 요소, 보안·세션 기술)의
    #     기술 일반 용어를 Claude가 덧붙였다. 외부 용어집과 대조하지 않았다
    #  2. 업무 개념으로도 흔히 쓰이는 말은 넣지 않는다:
    #     file, record, account, message, notification, email, report, document, user, request, response, session,
    #     module, class, library, queue, system, application, client, container, component, method, field, link, tab, window
    #  3. 주입 규칙(config/smoke_injection.yaml)과 주입 로그를 열지 않고 작성했다. 다만 작성자(Claude)는 이전 세션에서
    #     그 사전과 결함본 스토리를 본 적이 있으므로 완전히 독립적으로 작성했다고 할 수는 없다
    #  4. 주입 사전과 겹치는 용어 수·목록은 평가 결과(results/kg_refine_school.md)에 따로 적는다. 겹침을 보고 조정하지 않는다
    terms:
      given:            # Jay가 준 기준 용어
        [API, database, table, JSON, HTTP, cache, server, UI, form, page, button]
      storage:          # 저장 구조
        [DB, SQL, database table, column, schema, query, primary key, foreign key]
      data_format:      # 데이터 형식
        [XML, CSV, YAML, HTML]
      network_api:      # 통신·API
        [HTTPS, REST, REST API, endpoint, payload, URL, URI, socket, websocket, web socket, protocol]
      infrastructure:   # 인프라
        [backend, back end, frontend, front end, cloud, microservice, virtual machine]
      ui_element:       # UI 요소
        [user interface, GUI, interface, screen, web page, webpage, website, dropdown, drop down, dropdown menu,
         menu, checkbox, text field, textbox, text box, input field, dialog, dialog box, modal, popup, pop up,
         widget, icon, hyperlink, dashboard, toolbar, sidebar, app, mobile app]
      program:          # 프로그램 구성 요소
        [script, function, variable, thread, plugin, framework, SDK]
      security_tech:    # 보안·세션 기술
        [token, cookie, hash, encryption]

  R3_synonym:
    draft: true
    # 동의어 = WordNet 명사 synset 공유
    #   1. 두 이름 키가 모두 WordNet 명사 표제어(공백 → _)로 있으면 synset이 하나라도 겹칠 때
    #   2. 하나라도 표제어로 없으면, 단어 수가 같고(2개 이상) 자리마다 단어가 같거나 synset이 겹칠 때 (같은 단어만으로는 안 됨)
    #   이름 키가 완전히 같은 쌍(표기 차이)은 동의어로 보지 않는다
    senses: all            # all: 모든 뜻의 synset / first: 각 단어의 첫 번째 뜻만
    # 남길 이름: 입력 스토리에서 완전 일치한 스토리 수가 많은 이름. 같으면 LLM 출력 순서가 앞인 이름
    # 병합: 남길 이름 순서대로 훑으며, 이미 남긴 이름과 동의어면 그쪽으로 합친다 (연쇄 병합 없음)
    keep: most_frequent
    wordnet:
      corpus: wordnet      # nltk.download('wordnet') → WordNet 3.0
      version: "3.0"
      data_dir: .nltk_data # 저장소 안 (gitignore). 시스템 전역 위치에 받지 않는다
      zip_sha256: cbda5ea6eef7f36a97a43d4a75f85e07fccbb4f23657d27b4ccbc93e2646ab59
      nltk_version: 3.10.4

# 조합할 때 적용 순서
order: [R1_actor, R2_implementation, R3_synonym]

# 평가에서 돌리는 조합 (각각 단독 + 셋 다)
combinations:
  - []
  - [R1_actor]
  - [R2_implementation]
  - [R3_synonym]
  - [R1_actor, R2_implementation, R3_synonym]

# 민감도 (DRAFT 선택지의 다른 값으로 단독 규칙만 다시 계산. 기본값을 바꾸지 않는다)
sensitivity:
  R1_actor: {use_partial: [false, true]}
  R2_implementation: {match: [exact, head, any_word]}
  R3_synonym: {senses: [all, first]}
