# Gold standard 정정 내역. `python -m qus prepare`가 적용해서 benchmark/gold/gold.json을 만든다.
#
# 클래스와 association 끝점은 모두 normalize_term(소문자, 공백 정리, 마지막 단어 단수화)을 거친다.
# 정규화 후에도 gold 클래스에 연결되지 않는 끝점만 아래에 적는다.
# 연결되지 않는 끝점이 하나라도 남으면 prepare는 실패한다.

endpoint_aliases:
  camperplus:
    group: camp group                      # 클래스 목록에는 "camp group"만 있음
  supermarket:
    delivery service: delivery
    personal discount: special personal discount

# 채점할 때만 쓰는 예측 이름 별칭. endpoint_aliases도 채점에 함께 적용된다.
prediction_aliases:
  camperplus:
    parent: parentguardian                 # gold 이름이 스토리에 그대로 나오지 않음
    parent/guardian: parentguardian
    parent guardian: parentguardian

# 끝점이 gold 클래스 목록에 없어서 association에서 제외하는 경우
exclude_endpoints:
  ticket:
    order: >-
      association gold에만 있고 class gold에는 없다 (orders, order 표기 혼용).
      공개 class gold를 기준으로 하므로 이 끝점을 포함한 association을 모두 제외한다.
