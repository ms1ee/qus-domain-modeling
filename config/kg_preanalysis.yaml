# 출처 KG 예비 분석 (DRAFT, 2026-11-11 Jay). 모델 호출 없음, 기존 스모크 실행 기록만 쓴다.
# 계산식과 특징 정의는 전부 DRAFT다 (SWE_prj notes/decisions.md).
status: DRAFT

# 1. 그래프 증거의 정답 예측력
prediction:
  inputs: [original, unambiguous, problem_oriented, minimal, uniform,
           problem_oriented@50, problem_oriented@100, minimal@50, minimal@100, unambiguous@50]   # 실행 10회인 입력 (full_sentence는 3회라 뺀다)
  evidence: exact               # 근거 스토리·자리 = 완전 일치 엣지
  label: any_name_maps_to_gold  # 노드의 표기 중 하나라도 채점기 매핑(정규화·동의어 되돌림·별칭)으로 정답 클래스가 되면 양성
  model: {l2: 1.0}              # L2 로지스틱 회귀, 특징 표준화(학습 fold 기준), 절편 벌점 없음
  cv: leave_one_input_out       # 입력 하나를 빼고 나머지로 학습, 뺀 입력에서 AUC
  subsample:
    n: [3, 5, 10]               # 입력마다 실행 n회를 비복원 추출해 특징을 만든다. n=10은 전체라 1회만 계산
    repeats: 100
    seed: 2026

# 2. 관계 근거: 두 끝점이 같은 스토리에 함께 완전 일치하는 관계만 남긴다
relations:
  consensus_k: 5                # 합의 관계 = 관계 파싱에 성공한 실행 N회 중 등장 수 / N ≥ 0.5
  # Eval_A^Gold 방식(근사): 두 끝점이 모두 정답 클래스에 매핑되는 예측 관계만 채점한다.
  # 원 논문은 모델에 정답 클래스를 주고 관계를 뽑게 했지만, 여기는 모델이 클래스를 직접 뽑은 출력이다

# 3. 개념 중복도와 완충 (탐색적 분석)
redundancy:
  evidence: exact               # 정답 클래스 이름 키가 원본 스토리에 완전 일치한 스토리 수
