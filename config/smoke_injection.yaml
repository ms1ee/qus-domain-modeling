# 규칙 기반 결함 주입 규칙 — 전부 DRAFT (Claude 초안, 팀 확인 전).
# 동의어 목록, 주입 문구, 템플릿, 오타 규칙, 선정 기준은 연구 판단이다. 확인 전에는 본 실험에 쓰지 않는다.
# 사용: python -m qus --config smoke.yaml inject
#
# 공통 처리 (qus/inject.py)
# - 대상 스토리 수 = round_half_up(주입 비율 × 스토리 수). school: 0.2 × 61 = 12.2 → 12
# - 유형별로 적용 가능한 스토리를 시드로 섞은 순서대로 고친다. 정답 보존 검사에 걸려 되돌린 스토리는
#   건너뛰고 다음 스토리로 채운다. 그래도 모자라면 meta.json의 shortfall에 남긴다
# - 정답 보존 검사: 원본에 나오던 정답 클래스가 수정본에도 원래 이름이나 동의어로 1번 이상 남아야 한다.
#   unambiguous는 더 엄격하게 원래 이름이 남아야 한다. 깨지면 그 스토리 수정을 되돌리고 로그에 남긴다
# - 규칙 항목이 정답 클래스 단어와 겹치거나 동의어가 이미 원본 스토리에 있으면 그 항목은 쓰지 않고
#   meta.json의 excluded_rule_items에 남긴다

status: DRAFT

selection:
  status: DRAFT
  rounding: half_up

unambiguous:
  status: DRAFT
  description: 같은 개념을 스토리마다 다른 이름으로 부르게 한다 (정답 클래스 → 동의어)
  min_stories: 2            # 2개 이상 스토리에 나오는 클래스만 대상
  per_story: 1              # 스토리당 바꾸는 클래스 수. 그 스토리 안의 해당 클래스 출현은 모두 바꾼다
  max_stories_per_class: 2  # 클래스 하나당 바꾸는 스토리 수 상한 (2026-11-02 Jay 지시. 한 클래스 효과로 쏠리지 않게)
  skip_role_position: true  # 용어 치환은 means·ends에서만. "As a ___" role 자리는 바꾸지 않는다 (2026-11-02 Jay 지시)
  team_review:
    - "팀 검토: role 자리 제외 여부"
  synonym_choice: one_per_class   # 세트 안에서 클래스마다 동의어 1개를 시드로 고정
  # 앞 단어가 아래에 있으면 동사 용법으로 보고 바꾸지 않는다 ("directly message", "I mentor")
  skip_after_words: [to, directly, automatically, i, can, will, not]
  synonyms:
    school:
      student: [pupil, learner]
      teacher: [instructor, educator]
      guardian: [parent, caregiver]
      administrator: [school official, admin]
      mentor: [tutor, coach]
      message: [note, communication]
      class: [course, homeroom]
      timetable: [schedule, roster, calendar]   # schedule은 원본에 이미 있어 제외될 것 (검사 동작 확인용)
      grade: [mark, score]                      # mark도 원본(behavioral marks)에 있어 제외될 것
      submission: [hand-in, entry]
      assignment: [task, coursework]
      material: [content, resource]
      question: [quiz item, exercise]
      answer: [response, solution]
      behavior: [conduct, demeanor]
      disciplinary action: [sanction, penalty]
      digital learning module: [e-learning unit, online module]

problem_oriented:
  status: DRAFT
  description: means 뒤에 구현 세부 문구를 붙인다
  position: after_means     # ", so that" 앞. ends가 없으면 마지막 마침표 앞
  # 문구는 동사구에 붙는 부사구(by ...ing / via / through / over)만 쓴다. 앞 명사와 수 일치가 필요한
  # 관계절("which is ...")은 쓰지 않는다 — 문법 오류가 생기면 Full sentence 결함과 섞이기 때문 (2026-11-02 수정)
  # means의 마지막 마디(마지막 쉼표 뒤)에 아래 접속어가 있으면 종속절로 끝나는 것으로 보고 후보에서 뺀다.
  # 문구가 종속절을 꾸미는 것처럼 읽히기 때문 (2026-11-02 Jay 지시)
  exclude_if_means_ends_with_clause: [when, whenever, while, if, once, starting, after, before, until, unless,
                                      because, since, where, as soon as]
  team_review:
    - "팀 검토: 문구와 기능의 의미 일치"
  # 구현 용어 사전. 문구의 terms는 이 안에서만 고른다
  implementation_terms:
    - REST API
    - POST request
    - JSON payload
    - SQL database table
    - dropdown menu
    - modal dialog
    - cron job
    - backend server
    - HTML form
    - button
    - web socket connection
    - cache
  phrases:
    - text: by sending a POST request to the REST API
      terms: [POST request, REST API]
    - text: through a dropdown menu in a modal dialog
      terms: [dropdown menu, modal dialog]
    - text: by writing a JSON payload to an SQL database table
      terms: [JSON payload, SQL database table]
    - text: via a cron job on the backend server
      terms: [cron job, backend server]
    - text: by clicking a button that sends an HTML form
      terms: [button, HTML form]
    - text: over a web socket connection that uses a cache
      terms: [web socket connection, cache]

minimal:
  status: DRAFT
  description: 도메인과 무관한 메타 메모를 스토리 끝에 붙인다. 예시 나열(e.g.) 금지
  position: end
  phrases:
    - text: (discussed in sprint 3 meeting)
      terms: [sprint, meeting]
    - text: (see ticket 142 in the backlog)
      terms: [ticket, backlog]
    - text: "(priority: medium, estimate: 3 story points)"
      terms: [priority, estimate, story point]
    - text: (raised by the product owner during the last review)
      terms: [product owner, review]
    - text: (to be confirmed with the stakeholders next week)
      terms: [stakeholder, week]
    - text: (wording copied from the previous release notes)
      terms: [wording, release note]

uniform:
  status: DRAFT
  description: role·means·ends 내용은 그대로 두고 문장 틀만 바꾼다
  # 대상: "As a/an <role>[,] I want <means>[, so (that) <ends>]." 형식으로 읽히는 스토리
  # {article} a/an, {role}, {means} "I want " 뒤의 내용, {ends} "so that" 뒤의 내용 (마침표 제외)
  templates_with_ends:
    - "In order that {ends}, as {article} {role}, I want {means}."
    - "I, as {article} {role}, want {means} so that {ends}."
    - "As {article} {role}, I would like {means}, so that {ends}."
    - "Being {article} {role}, I want {means}; this way {ends}."
  templates_without_ends:
    - "I, as {article} {role}, want {means}."
    - "Being {article} {role}, I want {means}."

full_sentence:
  status: DRAFT
  description: 오타와 문장 조각을 넣는다. 정답 클래스 단어는 건드리지 않는다
  typos_per_story: 2
  typo_min_word_len: 4
  typo_ops: [swap_adjacent, drop_char, double_char]   # 첫 글자와 마지막 글자는 유지
  fragment_ops:                                       # 스토리당 1개 (적용 가능한 것 중 시드로 선택)
    split_ends: ends를 별도 조각 문장으로 뗀다 (", so that X." → ". So that X.")
    drop_subject: '"I want" 에서 주어를 뺀다 ("I want to" → "want to")'
