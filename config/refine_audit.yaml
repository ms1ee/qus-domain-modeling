# 정답 이름 위험 감사 설정 (2026-11-03 Jay 요청). kg-r2-v1 고정 후 감사, 결과로 규칙을 조정하지 않는다.
# 사용: python -m qus refine-audit → results/kg_refine_gold_audit.md, .json
#
# 9개 세트의 정답 클래스 이름에 R2(exact·head·any_word)와 R1을 적용해, 지워지는 정답 이름을 센다.
# 규칙은 작업 사본이 아니라 git 태그 rules_tag 의 config/refine_kg.yaml 을 쓴다 (작업 사본의 R2 목록이 다르면 멈춘다)

rules_tag: kg-r2-v1
gold_classes_xlsx: benchmark/gold/original/Gold standard - Classes.xlsx   # Zenodo 원본과 sha256 같음 (2026-11-03 확인)
# SWE_prj의 Zenodo 압축 해제본 (읽기만). qus benchmark/stories 의 5개 세트 파일과 바이트 단위로 같다 (2026-11-03 확인)
stories_dir: ../SWE_prj/data/benchmark/REJ-main/A Benchmark for Domain Model/User Stories
r2_modes: [exact, head, any_word]
sets:
  camperplus: {sheet: Camperplus, stories: camperplus.txt}
  fish_chips: {sheet: "Fish&Chips", stories: Fish_Chips.txt}
  grocery: {sheet: Grocery, stories: grocery.txt}
  planningpoker: {sheet: Planningpoker, stories: planningpoker.txt, encoding: cp1252}   # UTF-8 아님: 0x92(’) 6개, 나머지 ASCII
  recycling: {sheet: Recycling, stories: recycling.txt}
  school: {sheet: School, stories: school.txt}
  sports: {sheet: Sports, stories: sports.txt}
  supermarket: {sheet: Supermarket, stories: supermarket.txt}
  ticket: {sheet: Ticket, stories: Ticket.txt}
