# R3-LLM (DRAFT, 팀 확인 전): 출처 그래프로 후보 쌍을 좁히고, 로컬 LLM이 같은 개념인지 판단해 병합한다.
# 2026-11-03 Jay 지시. 설계: SWE_prj/notes/r3-llm-design.md. 판단 모델은 qwen/qwen3-8b (environment.md 1-1 공존 규칙).
# 사용: python -m qus --config smoke.yaml r3llm-validate [--dry-run]   (검증 세트)
#       python -m qus --config smoke.yaml r3llm-apply --dry-run          (103건 적용. 실행은 Jay가 따로 지시)
#
# 순환 논리 금지: 판단 단계(qus/refine_llm.py)는 주입 규칙·주입 로그·정답·별칭 표를 읽지 않는다.
# 검증 세트를 만드는 qus/r3llm_validation.py만 주입 로그와 정답을 읽고, 판단기에는 이름과 문장만 넘긴다.

status: DRAFT

# 후보 쌍 (DRAFT): 공통 이웃이 있고 같은 스토리에 함께 나오지 않는 쌍
#   공통 이웃 = 두 이름 각각과 같은 스토리에 함께 나오는 제3의 클래스가 1개 이상
#   대상 = B_KG(R1 → R2 head)를 적용한 뒤 남은 이름. 표기만 다른 이름(정규화 키 같음)은 첫 번째만 쓴다
# 주의: 이 기준은 주입 데이터를 보고 골랐다. School 스모크에서 채점기 기준 중복 쌍 15개(전부 unambiguous@50 주입 동의어)
#   중 "같은 스토리·같은 자리 공유" 기준은 0개, 이 기준은 13개를 포함했다 (notes/r3-llm-design.md 2절).
#   주입 동의어는 그 스토리 안의 원래 용어를 모두 바꾸므로 원래 용어와 함께 나오지 않는다. 이 성질에 맞춘 선택이다
candidates:
  rule: common_neighbor_not_cooccurring
  after_rules: [R1_actor, R2_implementation]

# 입력 (DRAFT)
sentences_per_name: 2          # 각 이름이 완전 일치한 스토리 중 스토리 번호가 앞선 것부터

# 프롬프트 (DRAFT, 문구는 팀 확인 전). 시스템 메시지 끝에 no_think_suffix를 붙인다
prompt:
  system_file: prompts/r3llm/judge_system.txt
  user_file: prompts/r3llm/judge_user.txt      # {pairs_json} 자리에 쌍 목록 JSON
  no_think_suffix: "/no_think"

# 생각 모드 확인: 응답마다 reasoning_content 길이, 본문 <think> 태그 유무·안쪽 글자 수, reasoning_tokens를 기록한다.
# 생각이 나왔다 = reasoning_content(공백 제외)가 있음 또는 <think> 안쪽 글이 있음 또는 reasoning_tokens > 0 (DRAFT 정의).
# 빈 <think></think> 태그만 있으면 기록만 하고 멈추지 않는다
thinking:
  stop_on_thinking: true

# 묶음 호출 (DRAFT): 실행 단위로 묶고, 프롬프트 추정 토큰 + max_tokens + 여유가 n_ctx 안에 들어가게 나눈다
batching:
  max_pairs_per_call: 25       # 출력 한 쌍에 약 50–60 토큰 → 25쌍이면 max_tokens 2048 안
  chars_per_token: 3.0         # 프롬프트 토큰 추정 (보수적으로 작게). 실제 값은 응답 usage.prompt_tokens로 기록한다
  safety_tokens: 256
  # 103건 적용 묶음만: 추정 프롬프트 토큰(글자 수/3) 상한 (2026-11-03 Jay: 스왑 증가 중단 뒤 묶음을 잘게).
  # 검증 묶음(23·23·21쌍)에는 쓰지 않는다. 프롬프트 문구와 판단 파라미터는 그대로다
  apply_max_prompt_tokens: 4000

# 판단 모델 (environment.md 1-1). 로드·언로드 방식은 스모크와 같다 (JIT 없음, 별도 identifier만 언로드)
model:
  name: qwen3-8b-judge
  provider: openai_compatible
  base_url: http://127.0.0.1:1234/v1
  model: r3llm-qwen3-8b          # lms load --identifier
  temperature: 0                 # DRAFT (Jay 지정)
  top_p: 1.0                     # DRAFT
  seed: 1                        # DRAFT (클라이언트가 seed를 요구한다)
  max_tokens: 2048               # DRAFT
  timeout_s: 900
  lmstudio:
    model_key: qwen/qwen3-8b
    model_file: lmstudio-community/Qwen3-8B-GGUF/Qwen3-8B-Q4_K_M.gguf
    model_file_bytes: 5027783968
    quantization: Q4_K_M                                    # GGUF general.file_type = 15
    model_file_sha256: a7676d257b10f3ce23aedba45e64ba61a5aa295f0009d87c5627f6c026a8f35f
    model_file_sha256_measured_at: "2026-11-03T01:41:07Z"
    identifier: r3llm-qwen3-8b
    context_length: 8192
    ttl: 900
    parallel: 1
    kv_bytes_per_token: 147456                               # 2 × 36층 × KV 헤드 8 × head_dim 128 × 2 B (GGUF 헤더)
    # 보내지 않는 샘플러는 LM Studio 값이 적용된다. hub model.yaml 기본: top_k 20, min_p 0 (실제 적용값은 미확인)
    unsent_samplers: [top_k, min_p, repeat_penalty, presence_penalty, frequency_penalty]
    # LM Studio 저장 설정(enableThinking 기본 true 포함)은 바꾸지 않는다. 생각 끄기는 /no_think로만 한다
  # 공존 규칙 (environment.md 1-1): 로드 목록이 비어 있고, 최근 30분 서버 로그에 다른 요청·로드·언로드가 없을 때만 로드
  exclusive:
    require_empty: true
    quiet_minutes: 30
    own_identifiers: [r3llm-qwen3-8b, smoke-mistral-7b-v0.3]   # 우리 요청·언로드는 "다른 요청"에서 뺀다
    # 우리 로드·언로드 원장 (2026-11-03 Jay 승인): 서버 로그의 로드·언로드 줄이 원장과 ±10초 안에서 맞으면 "다른 활동"에서 뺀다.
    # 우리 identifier가 아닌 요청이나 원장에 없는 로드가 있으면 멈춘다
    ledger: runs/ledger.jsonl
    ledger_tolerance_s: 10

# 출력 형식 (DRAFT). 검증 조건 (a)는 response_format으로 강제, (b)는 강제 없이 프롬프트로만 요청
response_schema:
  name: r3llm_pairs
  strict: true
  schema:
    type: object
    properties:
      pairs:
        type: array
        items:
          type: object
          properties:
            a: {type: string}
            b: {type: string}
            decision: {type: string, enum: [same, different, unsure]}
            reason: {type: string}
          required: [a, b, decision, reason]
          additionalProperties: false
    required: [pairs]
    additionalProperties: false

# 병합 (DRAFT): same만 병합. 남길 이름은 R3와 같은 기준(입력 스토리 완전 일치 수가 많은 이름, 같으면 출력 순서).
# 남길 이름 순서대로 훑으며 이미 남긴 이름과 same인 것만 합친다 (연쇄 병합 없음). unsure·different·응답 누락은 병합하지 않는다
merge:
  decision: same

# 103건 적용 (실행은 Jay 지시 후). 같은 입력(유형·비율)의 같은 판단 입력(두 이름 + 문장, sha256)은 한 번만 묻고 재사용한다.
# 쌍 안 a·b는 이름순으로 고정한다. 재사용 여부는 실행별 result.json에 남긴다
apply:
  response_format: true          # 2026-11-03 Jay 확정: json_schema 강제 (검증 조건 a). 검증에서 두 조건 결과가 같았고, 247회 적용에서 긴 묶음의 파싱 실패 위험을 막기 위함
  cache_scope: input

# 판단기 검증 (DRAFT)
validation:
  input: unambiguous@50          # 같음·다름 쌍 모두 이 입력의 스토리 문장을 쓴다 (문장 출처가 라벨과 겹치지 않게)
  seed: 2026                     # 쌍 순서와 쌍 안 a·b 순서 무작위화
  conditions:
    a: {response_format: true, stop_on_thinking: true}     # json_schema 강제
    b: {response_format: false, stop_on_thinking: false}   # 강제 없음, 프롬프트로만 JSON 요청. 생각은 기록만 (검증 단계 한정)
  # 통과 기준 (DRAFT, 실행 전 decisions.md에 고정): 조건별로 same 정밀도 ≥ 0.9, 정답 클래스끼리 오병합 ≤ 1
  pass_criteria: {same_precision_min: 0.9, gold_pair_merges_max: 1}
  wordnet_pairs: [[grade, class], [grades, class]]   # 공통 이웃 기준에 없으면 "WordNet 오병합 쌍"으로 추가

# 시간 추정 (dry-run용). 다른 연구의 LM Studio 로그(2026-11-01–02, Qwen3-8B Q4_K_M, parallel 4) 중앙값
estimate:
  prompt_tokens_per_s: 927
  gen_tokens_per_s: 48.3
  output_tokens_per_pair: 55
