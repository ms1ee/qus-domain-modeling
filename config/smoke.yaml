# 스모크 테스트 설정 — 개발 세트 School, 결함 유형별 1개 수정본, 로컬 Mistral.
# 본 실험 설정(experiment.yaml)과 분리한다. 사용: python -m qus --config smoke.yaml <command>
#
# 실행 기록: runs/smoke/<모델 이름>/<세트>/<입력>/rep<k>.json
# 채점 결과: results/smoke_school.csv, results/smoke_school_failures.csv

sets:
  school: School                 # 원 논문 프롬프트 튜닝 세트. 개발용으로만 쓴다

gold_file: gold_smoke.json       # 본 실험 gold.json을 덮어쓰지 않게 따로 둔다
run_name: smoke
scores_file: smoke_school.csv

inputs: [original, unambiguous, problem_oriented, minimal, uniform, full_sentence]
defect_types: [unambiguous, problem_oriented, minimal, uniform, full_sentence]
injection_rate: 0.2
injection_rules: smoke_injection.yaml   # 전부 DRAFT
repetitions: 3
seed: 2026                       # 주입 시드. 수정본 파일: data/noisy/<세트>/<유형>/seed2026.txt

models:
  mistral-7b-local:
    provider: openai_compatible
    base_url: http://127.0.0.1:1234/v1
    model: smoke-mistral-7b-v0.3   # lms load --identifier 값. 로드 후 /v1/models에 이 이름으로 보인다
    # 생성 파라미터 (2026-11-02 Jay 확정). 원 논문은 "We used their default parameters for simplicity."
    # (p.249)라고만 했고 그 실제 값은 미확인이다. 0.7은 반복 간 변동을 얻기 위한 우리 선택이다.
    temperature: 0.7
    top_p: 1.0
    seed: [1, 2, 3]                # 반복별 시드 (rep1=1, rep2=2, rep3=3). 같은 반복은 입력이 달라도 같은 시드
    max_tokens: 4096               # 프롬프트 약 3k + 4096 < n_ctx 8192
    timeout_s: 900                 # 호출 1회 HTTP 제한 시간 (운영값)
    lmstudio:
      model_key: mistralai/mistral-7b-instruct-v0.3          # lms ls 의 키
      variant: mistralai/mistral-7b-instruct-v0.3@q4_k_m
      model_file: lmstudio-community/Mistral-7B-Instruct-v0.3-GGUF/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
      model_file_bytes: 4372812000
      quantization: Q4_K_M                                   # GGUF general.file_type = 15
      identifier: smoke-mistral-7b-v0.3
      context_length: 8192                                   # n_ctx. 4096은 출력 절단 위험으로 쓰지 않는다
      ttl: 900                                               # 15분 유휴 시 LM Studio가 자동 언로드 (안전장치)
      # f16 KV 캐시: 2(K,V) × 32층 × KV헤드 8 × head_dim 128 × 2 B. GGUF 헤더 값으로 계산
      kv_bytes_per_token: 131072
      # 요청에 보내지 않는 샘플러. LM Studio 기본값이 적용되며 그 값은 미확인이다 (실행 기록에 이 목록이 남는다)
      unsent_samplers: [top_k, min_p, repeat_penalty, presence_penalty, frequency_penalty]

roles:
  extractors: [mistral-7b-local]
  injector: rule_based             # 규칙 기반 주입기. 모델이 아니다
  pipeline: null

# 메모리 기준 (2026-11-02 Jay 변경. environment.md 4-2의 스왑 여유 2 GB 기준은 쓰지 않는다:
# macOS 동적 스왑이라 전체 크기가 줄어들고, 지금은 다른 연구 모델이 로드돼 있지 않다)
memory_guard:
  overhead_gib: 0.5                # 필요량 = 모델 파일 + KV(n_ctx) + 0.5
  extra_margin_gib: 1.0            # 로드 전: 즉시 가용(free+inactive) ≥ 필요량 + 1
  max_pressure_level: 1            # kern.memorystatus_vm_pressure_level (1 정상, 2 경고, 4 위험). 로드 전·실행 중 모두
  max_swap_increase_gib: 1.0       # 실행 중: 스왑 사용량이 로드 직전보다 1 GiB 넘게 늘면 멈추고 언로드
